<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeOSum — Audit Log (F-09)</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --brown-dark:#3B1F0E; --brown-mid:#7C4A1E; --gold:#D4A017; --gold-light:#F0C040;
      --cream:#FDF8F2; --white:#FFFFFF; --gray-50:#F9F5F0; --gray-100:#F0EBE3;
      --gray-200:#DDD5C8; --gray-400:#9E8E7E; --gray-600:#6B5B4E;
      --green:#2E8B57; --green-bg:#E8F5EE; --green-border:#86EFAC;
      --amber:#D97706; --amber-bg:#FEF3C7; --amber-border:#FDE68A;
      --red:#DC2626; --red-bg:#FEE2E2; --red-border:#FCA5A5;
      --blue:#2563EB; --blue-bg:#EFF6FF; --blue-border:#BFDBFE;
      --purple:#7C3AED; --purple-bg:#F3E8FF;
      --teal:#059669; --teal-bg:#ECFDF5;
      --orange:#EA580C; --orange-bg:#FFF7ED;
      --indigo:#4F46E5; --indigo-bg:#EEF2FF;
      --sidebar-w:240px; --header-h:56px;
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--gray-50); color:var(--brown-dark); padding-top:36px; height:100vh; overflow:hidden; }

    /* DEMO BAR */
    .demo-bar { position:fixed; top:0; left:0; right:0; z-index:300; background:var(--brown-dark); padding:6px 16px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .demo-label { font-size:11px; font-weight:700; color:var(--gold-light); margin-right:4px; white-space:nowrap; }
    .demo-tab { padding:3px 11px; border-radius:20px; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); cursor:pointer; font-size:11px; font-weight:500; font-family:inherit; background:transparent; transition:all 0.15s; white-space:nowrap; }
    .demo-tab:hover { background:rgba(255,255,255,0.1); color:white; }
    .demo-tab.active { background:var(--gold); color:var(--brown-dark); border-color:var(--gold); font-weight:700; }

    /* SIDEBAR */
    .sidebar { width:var(--sidebar-w); background:var(--white); border-right:1px solid var(--gray-100); position:fixed; top:36px; left:0; bottom:0; display:flex; flex-direction:column; z-index:200; }
    .sidebar-logo { padding:16px 20px; border-bottom:1px solid var(--gray-100); display:flex; align-items:center; gap:10px; }
    .logo-icon { width:34px; height:34px; background:var(--brown-dark); border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--gold-light); font-size:17px; }
    .logo-text { font-size:16px; font-weight:700; color:var(--brown-dark); }
    .logo-text span { color:var(--gold); }
    nav { flex:1; padding:14px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
    .nav-label { font-size:10px; font-weight:600; color:var(--gray-400); letter-spacing:0.8px; text-transform:uppercase; padding:10px 8px 4px; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; color:var(--gray-600); transition:background 0.15s; }
    .nav-item:hover { background:var(--gray-50); color:var(--brown-dark); }
    .nav-item.active { background:var(--cream); color:var(--brown-dark); font-weight:600; }
    .nav-icon { font-size:15px; width:20px; text-align:center; }
    .sidebar-footer { padding:12px; border-top:1px solid var(--gray-100); }
    .logout-btn { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; color:var(--red); background:var(--red-bg); }

    /* MAIN */
    .main-wrapper { margin-left:var(--sidebar-w); height:calc(100vh - 36px); display:flex; flex-direction:column; overflow:hidden; }
    .topbar { height:var(--header-h); background:var(--white); border-bottom:1px solid var(--gray-100); display:flex; align-items:center; padding:0 18px; gap:10px; flex-shrink:0; }
    .topbar-title { font-size:18px; font-weight:700; color:var(--brown-dark); }
    .spacer { flex:1; }
    .topbar-btn { padding:7px 14px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; }
    .topbar-btn.secondary { background:var(--gray-50); color:var(--brown-dark); border:1px solid var(--gray-200); }
    .user-chip { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border-radius:20px; background:var(--gray-50); border:1px solid var(--gray-200); }
    .user-avatar { width:26px; height:26px; border-radius:50%; background:var(--brown-mid); color:white; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
    .user-name { font-size:12px; font-weight:600; color:var(--brown-dark); }
    .content-area { flex:1; overflow-y:auto; padding:20px 24px; }
    .view { display:none; }
    .view.active { display:block; }

    /* SECTION HEADER */
    .section-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
    .section-title { font-size:15px; font-weight:700; color:var(--brown-dark); }
    .section-sub { font-size:12px; color:var(--gray-400); margin-top:3px; }

    /* FILTER BAR */
    .filter-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; background:var(--white); border:1px solid var(--gray-100); border-radius:10px; padding:10px 14px; }
    .filter-label { font-size:12px; font-weight:600; color:var(--gray-600); white-space:nowrap; }
    .filter-select { padding:6px 10px; border:1.5px solid var(--gray-200); border-radius:7px; font-size:12px; color:var(--brown-dark); background:var(--white); outline:none; cursor:pointer; font-family:inherit; }
    .filter-divider { width:1px; height:20px; background:var(--gray-200); }
    .filter-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:var(--brown-dark); color:white; border-radius:20px; font-size:11px; font-weight:600; }
    .chip-x { cursor:pointer; opacity:0.7; margin-left:2px; }
    .filter-chip-amber { background:var(--amber); color:white; }

    /* INFO / ALERT BARS */
    .info-bar { display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--blue-bg); border:1px solid var(--blue-border); border-radius:8px; font-size:12px; color:var(--blue); margin-bottom:14px; flex-wrap:wrap; line-height:1.6; }
    .info-tag { padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; background:var(--blue); color:white; white-space:nowrap; }
    .alert-banner { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; background:var(--red-bg); border:1.5px solid var(--red-border); border-radius:10px; margin-bottom:14px; }
    .alert-icon { font-size:20px; flex-shrink:0; }
    .alert-title { font-size:13px; font-weight:700; color:var(--red); margin-bottom:4px; }
    .alert-sub { font-size:12px; color:var(--gray-600); line-height:1.6; }
    .immutable { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--blue-bg); border:1px solid var(--blue-border); border-radius:8px; font-size:12px; color:var(--blue); margin-bottom:14px; font-weight:600; }

    /* EVENT TABLE */
    .tbl-wrap { background:var(--white); border:1px solid var(--gray-100); border-radius:12px; overflow:hidden; }
    .evt-tbl { width:100%; border-collapse:collapse; }
    .evt-tbl th { text-align:left; padding:9px 12px; background:var(--gray-50); color:var(--gray-400); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--gray-100); white-space:nowrap; }
    .evt-tbl td { padding:10px 12px; border-bottom:1px solid var(--gray-100); font-size:12px; vertical-align:middle; }
    .evt-tbl tr:last-child td { border-bottom:none; }
    .evt-tbl tr:hover td { background:var(--gray-50); cursor:pointer; }

    /* CATEGORY BADGES */
    .cat { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; white-space:nowrap; }
    .cat-auth      { background:var(--blue-bg); color:var(--blue); }
    .cat-billing   { background:var(--amber-bg); color:var(--amber); }
    .cat-orders    { background:var(--green-bg); color:var(--green); }
    .cat-setup     { background:var(--purple-bg); color:var(--purple); }
    .cat-inventory { background:var(--teal-bg); color:var(--teal); }
    .cat-staff     { background:var(--orange-bg); color:var(--orange); }
    .cat-analytics { background:var(--indigo-bg); color:var(--indigo); }

    /* STATUS & MISC */
    .status-ok    { color:var(--green); font-size:14px; }
    .status-warn  { color:var(--amber); font-size:14px; }
    .status-error { color:var(--red); font-size:14px; }
    .mono { font-family:monospace; }
    .evt-id   { font-family:monospace; font-size:11px; color:var(--gray-400); }
    .evt-type { font-family:monospace; font-size:11px; font-weight:700; color:var(--brown-dark); }
    .ip-tag   { font-family:monospace; font-size:11px; color:var(--gray-600); background:var(--gray-100); padding:2px 6px; border-radius:4px; white-space:nowrap; }
    .ip-sus   { color:var(--red) !important; background:var(--red-bg) !important; }

    /* PAGINATION */
    .pagination { display:flex; align-items:center; gap:6px; margin-top:12px; }
    .pag-btn { padding:5px 11px; border:1px solid var(--gray-200); border-radius:6px; font-size:12px; cursor:pointer; background:var(--white); font-family:inherit; color:var(--gray-600); }
    .pag-btn.active { background:var(--brown-dark); color:white; border-color:var(--brown-dark); }
    .pag-info { font-size:12px; color:var(--gray-400); margin-left:auto; }

    /* EVENT DETAIL CARD */
    .detail-card { background:var(--white); border:1px solid var(--gray-100); border-radius:12px; padding:24px; margin-bottom:14px; }
    .detail-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--gray-100); }
    .detail-title { font-size:16px; font-weight:700; color:var(--brown-dark); font-family:monospace; }
    .detail-sub { font-size:12px; color:var(--gray-400); margin-top:3px; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .field-box { background:var(--gray-50); border-radius:8px; padding:12px; }
    .field-key { font-size:10px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; font-family:monospace; }
    .field-val { font-size:12px; font-weight:600; color:var(--brown-dark); font-family:monospace; word-break:break-all; }
    .payload-title { font-size:12px; font-weight:700; color:var(--gray-600); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; }
    .payload-code { background:var(--brown-dark); border-radius:10px; padding:16px; font-family:monospace; font-size:12px; color:#E8D5B8; line-height:1.9; overflow-x:auto; }
    .pk { color:var(--gold-light); }
    .ps { color:#86EFAC; }
    .pn { color:#93C5FD; }
    .pb { color:#FCA5A5; }
    .pc { color:#D1D5DB; }

    /* SCHEMA */
    .schema-card { background:var(--white); border:1px solid var(--gray-100); border-radius:12px; overflow:hidden; margin-bottom:14px; }
    .schema-card-title { font-size:13px; font-weight:700; color:var(--brown-dark); padding:12px 16px; background:var(--gray-50); border-bottom:1px solid var(--gray-100); }
    .schema-tbl { width:100%; border-collapse:collapse; }
    .schema-tbl th { text-align:left; padding:9px 12px; background:var(--gray-50); color:var(--gray-400); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--gray-100); }
    .schema-tbl td { padding:10px 12px; border-bottom:1px solid var(--gray-100); font-size:12px; vertical-align:middle; }
    .schema-tbl tr:last-child td { border-bottom:none; }
    .schema-field { font-family:monospace; font-weight:700; color:var(--brown-dark); }
    .schema-type { font-family:monospace; font-size:11px; color:var(--blue); background:var(--blue-bg); padding:2px 6px; border-radius:4px; white-space:nowrap; }
    .schema-req { font-size:10px; font-weight:700; color:var(--green); background:var(--green-bg); padding:2px 8px; border-radius:20px; white-space:nowrap; }
    .schema-desc { font-size:12px; color:var(--gray-600); }

    /* CATEGORY GRID */
    .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .cat-card { background:var(--white); border:1px solid var(--gray-100); border-radius:10px; padding:14px; }
    .cat-card-title { font-size:12px; font-weight:700; color:var(--brown-dark); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .cat-card-events { font-size:11px; color:var(--gray-600); line-height:1.9; font-family:monospace; }
  </style>
</head>

<script>
/* ─── DATA ─── */
const EVENTS = [

/* ─── HELPERS ─── */
function catClass(c) {
  return {Auth:'cat-auth',Billing:'cat-billing',Orders:'cat-orders',Setup:'cat-setup',Inventory:'cat-inventory',Staff:'cat-staff',Analytics:'cat-analytics'}[c] || 'cat-auth';
}
function statusIcon(s) {
  if (s==='ok')    return '<span class="status-ok">✓</span>';
  if (s==='warn')  return '<span class="status-warn">⚠</span>';
  if (s==='error') return '<span class="status-error">✕</span>';
  return '';
}

/* ─── RENDER: event table into a container div ─── */
function renderTable(events, id) {
  const rows = events.map(e => {
    const susCls = e.ip === '103.45.12.88' ? ' ip-sus' : '';
    return `<tr>
      <td><span class="evt-id">${e.id}</span></td>
      <td style="font-size:11px;color:var(--gray-600);white-space:nowrap;">${e.ts}</td>
      <td><span class="cat ${catClass(e.cat)}">${e.cat}</span></td>
      <td><span class="evt-type">${e.type}</span></td>
      <td style="font-size:12px;color:var(--gray-600);">${e.user}</td>
      <td style="font-size:12px;color:var(--brown-dark);">${e.summary}</td>
      <td><span class="ip-tag${susCls}">${e.ip}</span></td>
      <td style="text-align:center;">${statusIcon(e.status)}</td>
    </tr>`;
  }).join('');
  document.getElementById(id).innerHTML = `
    <div class="tbl-wrap">
      <table class="evt-tbl">
        <thead><tr>
          <th>Event ID</th><th>Timestamp (IST)</th><th>Category</th><th>Event Type</th>
          <th>User</th><th>Summary</th><th>IP Address</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

/* ─── SHOW CONTROLLER ─── */
const STATES = ['log','filtered','detail','void','auth','schema'];

function show(state) {
  document.querySelectorAll('.demo-tab').forEach((t,i) => {
    t.classList.toggle('active', STATES[i] === state);
  });
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + state).classList.add('active');
}
